<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lodgy Co-op</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--sky);
        font: 16px/1.4 system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #overlay {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        padding: 8px 10px;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 4px;
        pointer-events: none;
        white-space: pre;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        /* Two strokes with a dark outline, readable on sand and on sky. */
        background:
          linear-gradient(#fff, #fff) center / 2px 100% no-repeat,
          linear-gradient(#fff, #fff) center / 100% 2px no-repeat;
        filter: drop-shadow(0 0 1px #000);
      }
      #crosshair[hidden] {
        display: none;
      }
      #overlay:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <pre id="overlay"></pre>
    <div id="crosshair" hidden></div>
    <div id="results" hidden></div>
    <div id="reconnect" role="status" hidden><div id="reconnect-card" class="ui-panel"><span id="reconnect-spinner" aria-hidden="true"></span>Reconnecting…</div></div>
    <div id="home" hidden>
      <form id="home-form" class="ui-panel" novalidate>
        <h1 id="home-title">Lodgy Co-op</h1>
        <p id="home-tagline">Up to six players, one shared vehicle, a road trip around Marrakech.</p>
        <label>
          Your name
          <input id="home-name" class="ui-input" maxlength="16" autocomplete="nickname" />
        </label>
        <button id="home-primary" class="ui-btn ui-btn-primary" type="submit">Create room</button>
        <div id="home-room-row">
          <label>
            Or join a room
            <input id="home-room" class="ui-input" maxlength="24" autocapitalize="none" autocomplete="off" placeholder="camel" />
          </label>
          <button id="home-join" class="ui-btn" type="button">Join</button>
        </div>
        <p id="home-error" role="alert"></p>
        <a id="home-link" href="/" hidden>Back to the home page</a>
        <a id="home-credits" href="/CREDITS.md" target="_blank" rel="noopener">Credits</a>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
