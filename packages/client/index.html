<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lodgy Co-op</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #cfe6f5;
        font: 16px/1.4 system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #overlay {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        padding: 8px 10px;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 4px;
        pointer-events: none;
        white-space: pre;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        /* Two strokes with a dark outline, readable on sand and on sky. */
        background:
          linear-gradient(#fff, #fff) center / 2px 100% no-repeat,
          linear-gradient(#fff, #fff) center / 100% 2px no-repeat;
        filter: drop-shadow(0 0 1px #000);
      }
      #crosshair[hidden] {
        display: none;
      }
      #results {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        white-space: pre-line;
        text-align: center;
      }
      #results button {
        margin: 12px 6px 0;
        padding: 8px 14px;
        font: inherit;
        color: #fff;
        background: #2f6f9f;
        border: 0;
        border-radius: 6px;
      }
      #results [hidden],
      #results[hidden] {
        display: none;
      }
      #reconnect {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 20px;
        /* Takes pointer input so nothing underneath can be pressed while the connection is down. */
        pointer-events: auto;
      }
      #reconnect[hidden] {
        display: none;
      }
      #overlay:empty {
        display: none;
      }
      #home {
        position: fixed;
        inset: 0;
        display: grid;
        /* With the keyboard open on a phone in landscape the form is taller than the screen, so it must scroll. */
        overflow-y: auto;
        background: #cfe6f5;
      }
      #home[hidden],
      #home [hidden] {
        display: none;
      }
      #home-form {
        display: grid;
        gap: 12px;
        width: min(320px, 90vw);
        /* Centres the form, and unlike centring on the container keeps its top reachable when it overflows. */
        margin: auto;
        padding: 24px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      }
      #home-form h1 {
        margin: 0;
        font-size: 22px;
      }
      #home-form label {
        display: grid;
        gap: 4px;
        font-size: 14px;
      }
      #home-form input,
      #home-form button {
        padding: 10px;
        font: inherit;
        /* iOS Safari zooms the page when a focused field's text is smaller than 16px. */
        font-size: 16px;
        border: 1px solid #9ab;
        border-radius: 6px;
      }
      #home-form button {
        color: #fff;
        background: #2f6f9f;
        border-color: #2f6f9f;
      }
      #home-form button:disabled {
        opacity: 0.6;
      }
      #home-room-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: end;
      }
      #home-error {
        margin: 0;
        min-height: 1.4em;
        color: #b3261e;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <pre id="overlay"></pre>
    <div id="crosshair" hidden></div>
    <div id="results" hidden></div>
    <div id="reconnect" role="status" hidden>Reconnecting…</div>
    <div id="home" hidden>
      <form id="home-form" novalidate>
        <h1 id="home-title">Lodgy Co-op</h1>
        <label>
          Your name
          <input id="home-name" maxlength="16" autocomplete="nickname" />
        </label>
        <button id="home-primary" type="submit">Create room</button>
        <div id="home-room-row">
          <label>
            Or join a room
            <input id="home-room" maxlength="24" autocapitalize="none" autocomplete="off" placeholder="camel" />
          </label>
          <button id="home-join" type="button">Join</button>
        </div>
        <p id="home-error" role="alert"></p>
        <a id="home-link" href="/" hidden>Back to the home page</a>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
